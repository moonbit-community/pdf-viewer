<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoonBit PDF Viewer</title>
    <link rel="stylesheet" href="./viewer.css" />
    <link rel="stylesheet" href="./vendor/xfa/xfa.css" />
  </head>
  <body>
    <header class="toolbar" aria-label="文档工具栏">
      <a class="brand" href="./">MoonBit <strong>PDF</strong></a>
      <div class="file-controls">
        <button id="open-file" type="button">打开 PDF</button>
        <input
          id="file-input"
          type="file"
          accept="application/pdf,.pdf"
          hidden
        />
        <span id="file-name" title="">未打开文档</span>
        <button id="outline-toggle" type="button" disabled>目录</button>
        <button id="thumbnail-toggle" type="button" disabled>缩略图</button>
        <button id="info-toggle" type="button" disabled>信息</button>
      </div>
      <div class="page-controls">
        <button id="previous-page" title="上一页" aria-label="上一页" disabled>
          ↑
        </button>
        <input
          id="page-number"
          type="number"
          min="1"
          value="1"
          aria-label="页码"
          disabled
        />
        <span id="page-count">/ 0</span>
        <button id="next-page" title="下一页" aria-label="下一页" disabled>
          ↓
        </button>
      </div>
      <div class="zoom-controls">
        <button id="zoom-out" title="缩小" aria-label="缩小" disabled>−</button>
        <select id="zoom" aria-label="缩放" disabled>
          <option value="fit">适合宽度</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select>
        <button id="zoom-in" title="放大" aria-label="放大" disabled>+</button>
        <button id="rotate" title="顺时针旋转" aria-label="顺时针旋转" disabled>
          ↻
        </button>
        <select id="view-mode" aria-label="页面模式" disabled>
          <option value="scroll">连续</option>
          <option value="page">单页</option>
        </select>
      </div>
      <div class="search-controls" role="search" aria-label="搜索文档">
        <input
          id="search-query"
          type="search"
          placeholder="搜索文档"
          aria-label="搜索文档"
          disabled
        />
        <button id="search-previous" title="上一个结果" aria-label="上一个结果" disabled>↑</button>
        <button id="search-next" title="下一个结果" aria-label="下一个结果" disabled>↓</button>
        <label title="区分大小写"><input id="search-case" type="checkbox" disabled /> Aa</label>
        <label title="只匹配完整单词"><input id="search-whole" type="checkbox" disabled /> 词</label>
        <label title="忽略变音符号"><input id="search-diacritic" type="checkbox" checked disabled /> é</label>
        <span id="search-status" aria-live="polite"></span>
      </div>
      <button id="print" title="打印" aria-label="打印" disabled>打印</button>
      <button id="download" disabled>下载</button>
    </header>
    <main id="viewer" tabindex="0" aria-label="PDF 文档" aria-busy="false">
      <section id="empty-state">
        <div class="document-symbol" aria-hidden="true">PDF</div>
        <h1>打开一份文档</h1>
        <p>将 PDF 拖到这里，或选择本地文件。</p>
        <button id="open-empty" type="button">选择 PDF 文件</button>
        <p class="hint">文档在浏览器中读取和渲染。</p>
      </section>
      <div id="pages"></div>
    </main>
    <div id="print-pages" aria-hidden="true" inert></div>
    <aside id="sidebar" aria-label="文档导航" hidden>
      <div class="sidebar-header">
        <strong id="sidebar-title">目录</strong>
        <button id="sidebar-close" type="button" title="关闭面板" aria-label="关闭面板">×</button>
      </div>
      <div id="sidebar-content"></div>
    </aside>
    <footer class="status-bar">
      <span id="status" role="status" aria-live="polite">就绪</span>
      <span id="selection-status"></span>
      <button id="copy-selection" disabled>复制选中文字</button>
    </footer>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
