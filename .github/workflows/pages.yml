name: GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify web viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - name: Install verified MoonBit
        run: |
          bash tools/ci/install_moon.sh "$RUNNER_TEMP/pdf-moon"
          echo "$RUNNER_TEMP/pdf-moon/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$RUNNER_TEMP/pdf-moon" >> "$GITHUB_ENV"
      - name: Install pinned dependencies
        run: |
          moon install || moon install || moon install
          npm ci --prefix tools/web-assets --ignore-scripts --omit=optional
          npm ci --prefix tools/test-host --ignore-scripts
          tools/test-host/node_modules/.bin/playwright install --with-deps chromium
      - name: Build static viewer
        run: moon run tools/build_pages.mbtx
      - name: Exercise the published site under a repository subpath
        run: node tools/pages_browser_test.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _build/pages
          include-hidden-files: true
          retention-days: 7
      - name: Check Pages configuration
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_pages_status=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 120 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output _build/pages-site.json --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [[ "$ci_pages_status" == 404 ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Enable Settings > Pages > Source: GitHub Actions, then run this workflow again.'
          elif [[ "$ci_pages_status" == 200 ]]; then
            ci_pages_source=$(node -p "require('./_build/pages-site.json').build_type")
            if [[ "$ci_pages_source" == workflow ]]; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            else
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo '::notice::Set Settings > Pages > Source to GitHub Actions, then run this workflow again.'
            fi
          else
            echo "Pages configuration request failed: HTTP $ci_pages_status" >&2
            exit 1
          fi
      - name: Retain browser verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-browser-report
          path: _build/pages-test-*/
          if-no-files-found: ignore

  deploy:
    name: Publish web viewer
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
